<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padashala | Digital Classroom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col items-center justify-center">

    <main class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-700 tracking-tight">Padashala</h1>
            <p class="text-sm text-slate-500 mt-1">Digital Classroom Portal</p>
        </div>

        <form id="selection-form" class="space-y-5">
            <div>
                <label for="class-select" class="block text-sm font-medium text-slate-700 mb-1">Class</label>
                <select id="class-select" disabled class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    <option value="">Loading...</option>
                </select>
            </div>

            <div>
                <label for="subject-select" class="block text-sm font-medium text-slate-700 mb-1">Subject</label>
                <select id="subject-select" disabled class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    <option value="">Select Class first</option>
                </select>
            </div>

            <div>
                <label for="chapter-select" class="block text-sm font-medium text-slate-700 mb-1">Chapter</label>
                <select id="chapter-select" disabled class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    <option value="">Select Subject first</option>
                </select>
            </div>

            <div>
                <label for="period-select" class="block text-sm font-medium text-slate-700 mb-1">Period</label>
                <select id="period-select" disabled class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    <option value="">Select Chapter first</option>
                </select>
            </div>

            <button type="submit" id="start-btn" disabled class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Start Class
            </button>
        </form>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
